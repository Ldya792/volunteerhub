name: Terraform plan

# Runs on every pull request that changes infrastructure
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/terraform-*.yml"

# Least privilege for the GitHub token itself
permissions:
  contents: read     # check out the code
  id-token: write    # request the OIDC token for Google (keyless login)

# Never run two plans at once on the same PR
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: volunteerhub-lw-2026
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to Google Cloud (keyless, read-only account)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_PLAN_SA }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt

      - name: Show plan on the run summary page
        if: always()
        run: |
          echo "## Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 plan.txt >> "$GITHUB_STEP_SUMMARY" || echo "No plan output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
