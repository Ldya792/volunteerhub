name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: volunteerhub-lw-2026
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to Google Cloud (keyless, main-only account)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SA }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan (saved)
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Apply the saved plan
        run: terraform apply -input=false -no-color tfplan
